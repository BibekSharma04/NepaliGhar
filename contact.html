<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us</title>
  <link rel="stylesheet" href="css/contact.css">
  <script src="https://kit.fontawesome.com/59ee7f7742.js" crossorigin="anonymous"></script>
</head>
<body>
  

<div id="Contact">
  <div class="contact-content">
    <h1>Reservation & Contact</h1>
    <p>Book your table or get in touch with us for any inquiries.</p>
    </div>
    <div class="contact-reservation">
      <div class="contact-info">
      <h2>Get in Touch</h2>
        <div class="contact-item">
          <i class="fa-solid fa-location-crosshairs"></i>
           <p><strong>Address:</strong> 123 Main Street, Kathmandu, Nepal</p>
        </div>
        <div class="contact-item">
        <i class="fa-solid fa-phone"></i>
       <p><strong>Phone:</strong> +977 123-456-7890</p>
       </div>

       <div class="contact-item">
       <i class="fa-regular fa-envelope"></i>
       <p><strong>Email:</strong> nepalighar@gmail.com</p>
        </div>

        <div class="contact-item">
        <i class="fa-regular fa-clock"></i>
        <p><strong>Opening Hours:</strong> 10:00 AM - 10:00 PM</p>
       </div>

       <iframe class="map" loading="lazy" src="https://www.google.com/maps?q=Kathmandu,Nepal&output=embed"></iframe>
    </div>

    <div class="reservation-form">
      <h2>Book a Table</h2>
      <form id="reservation-form">
        <label for="name">Name*</label>
        <input type="text" id="name" name="name" placeholder="Your Name" required>

        <div class="form-row">
          <div>
            <label for="email">Email*</label>
            <input type="email" id="email" name="email" placeholder="Your Email" required>
          </div>
           
      <div><label for="phone">Phone*</label>
        <input type="tel" id="phone" name="phone" placeholder="Your Phone Number" required>
      </div>
        </div>
  
        <div class="form-row">
        <div> <label for="date">Date*</label>
        <input type="date" id="date" name="date" required>
       </div>

       <div> <label for="time">Time*</label>
        <input type="time" id="time" name="time" required>
      </div>
       </div>
       
        <label for="guest">Number of Guests*</label>
        <select id="guest" name="guest" required>
          <option value="">Select</option>
          <option value="1">1 Guest</option>
          <option value="2">2 Guests</option>
          <option value="3">3 Guests</option>
          <option value="4">4 Guests</option>
          <option value="5">5 Guests</option>
          <option value="6">6 Guests</option>
          <option value="7">7 Guests</option>
          <option value="8">8 Guests</option>
          <option value="9">9 Guests</option>
          <option value="10+">10+ Guests</option>
        </select>

        <label for="request" class="special-request">Special Requests</label>
        <textarea id="request" name="request" placeholder="Any special requests?"></textarea>

        <button type="submit">Submit Reservation</button>
        
      </form>
</div>
 </div>
    
 










   <script src="script.js"></script>
</body>
</html>
